<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyFlow - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>StudyFlow</h1>

            <p>Stay organized. Stay ahead.</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Log In
                </button>

            </form>


            <p class="signup-text">

                Don't have an account?

                <a href="#" onclick="showSignup()">
                    Create one
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
